[package]
name = "web-note-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["query"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"], optional = true }
web-note-core = { version = "0.1.0", path = "../core" }

[features]
swagger = ["dep:utoipa-swagger-ui"]

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"
