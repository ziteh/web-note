name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: pnpm --dir web install --frozen-lockfile

      - run: pnpm --dir web build

      - run: cargo build --release -p web-note-server --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          cp target/x86_64-unknown-linux-musl/release/web-note-server web-note-server-x86_64-linux
          sha256sum web-note-server-x86_64-linux > web-note-server-x86_64-linux.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" web-note-server-x86_64-linux* --generate-notes
