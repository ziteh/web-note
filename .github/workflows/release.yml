name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: web-note-server-x86_64-linux
            bin: web-note-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: web-note-server-x86_64-windows.exe
            bin: web-note-server.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: web-note-server-aarch64-macos
            bin: web-note-server
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: pnpm --dir web install --frozen-lockfile

      - run: pnpm --dir web build

      - run: cargo build --release -p web-note-server --target ${{ matrix.target }}

      - name: Package
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
